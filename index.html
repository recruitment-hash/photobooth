<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFEgram Photo Booth</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .booth-container { position: relative; display: inline-block; max-width: 500px; width: 100%; }
        video, canvas { width: 100%; border-radius: 10px; display: block; }
        /* Area transparan untuk lubang kamera di tengah template */
        .camera-feed { position: absolute; top: 22%; left: 11%; width: 78%; height: 50%; object-fit: cover; z-index: 1; border-radius: 20px; }
        .frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .controls { margin-top: 15px; }
        button { padding: 10px 20px; font-size: 16px; background: #d32f2f; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <h2>JFE Engineering Indonesia - Photo Booth</h2>
    
    <div class="booth-container">
        <!-- Tampilan Kamera Live -->
        <video id="video" class="camera-feed" autoplay playsinline></video>
        <!-- Canvas untuk hasil foto -->
        <canvas id="canvas" class="camera-feed" style="display:none;"></canvas>
        
        <!-- Masukkan link template bingkai PNG transparan Anda di sini -->
        <img src="https://i.postimg.cc/y8yPyC6m/Gemini-Generated-Image-7r91rk7r91rk7r91.png" class="frame-overlay" alt="Frame Booth">
    </div>

    <div class="controls">
        <button id="capture-btn">Ambil Foto</button>
        <button id="download-btn" style="display:none; background: #2e7d32;">Unduh Foto</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const downloadBtn = document.getElementById('download-btn');

        // Akses kamera web/ponsel
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal mengakses kamera: " + err); });

        // Ambil foto
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            video.style.display = 'none';
            canvas.style.display = 'block';
            
            captureBtn.style.display = 'none';
            downloadBtn.style.display = 'inline-block';

            // Logika untuk menggabungkan dengan gambar frame bisa ditambahkan di sini
            downloadBtn.href = canvas.toDataURL('image/png');
            downloadBtn.download = 'JFEgram-Photobooth.png';
        });

        downloadBtn.addEventListener('click', () => {
            // Reset kembali ke kamera jika ingin ambil foto ulang
            video.style.display = 'block';
            canvas.style.display = 'none';
            captureBtn.style.display = 'inline-block';
            downloadBtn.style.display = 'none';
        });
    </script>
</body>
</html>
